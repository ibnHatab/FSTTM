# fsttm-go — robot-dog deployment (Orin target; paths for this dev box).
llm:
    model: /home/axadmin/repo/vox/FSTTM/models/Phi-3-mini-4k-instruct-Q4_K_M.gguf
    n_ctx: 2048
    n_batch: 2048
    n_threads: 6
    n_gpu_layers: 99      # 0 = CPU-only fallback profile on the Orin
stt:
    model: /home/axadmin/repo/vox/FSTTM/models/ggml-base.en-q5_1.bin
    language: en
    parasites: ["thank you", "thanks", "thanks for watching", "you"]
tts:
    engine: librhvoice    # in-process synthesis: exact progress + mid-synthesis cut
                          # ("subprocess" = RHVoice-client|aplay fallback)
    voice: SLT            # Linux RHVoice: alan|bdl|clb|evgeniy-eng|lyubov|slt
    rate: 0.3
    volume: -0.1
    player: "aplay -q"
vad:
    aggressiveness: 3
    padding_ms: 700
# Echo cancellation + noise suppression (port of the Python EchoCancelSession):
# module-echo-cancel with webrtc gives AEC + built-in NS; rnnoise chains the
# LADSPA suppressor on the AEC output — the recipe for a mic strapped to
# twelve motors. PulseAudio defaults are routed so capture/playback just work.
aec:
    enabled: false            # true on the robot (needs PulseAudio/PipeWire)
    rnnoise: false            # true when librnnoise_ladspa.so is installed
    method: auto              # auto | webrtc | speex
    source_master: ""         # raw mic; "" = current default source

# Owner voice imprint — the robot listens to ONE person. Enroll:
#   ./bin/fsttm-imprint -model models/speaker/wespeaker_en_voxceleb_CAM++.onnx \
#       -profile models/speaker/owner.json -owner you -record 3
# Ownership transfer = re-run enrollment (replaces the profile).
voice_id:
    model: "/home/axadmin/repo/vox/FSTTM/models/speaker/wespeaker_en_voxceleb_CAM++.onnx"
    profile: "/home/axadmin/repo/vox/FSTTM/models/speaker/owner.json"
    threshold: 0.40           # cosine acceptance (human voices)
    gate: wake                # off | wake (imprinting) | always

attention:
    enabled: false            # true → asleep until the wake word (owner-gated)
    wake_words: ["rex", "hey rex", "hello rex"]
    sleep_phrases: ["go to sleep", "voice off", "stop listening", "that's all"]

# Nina robot link (nina_speak override): jsonl events on stdout for the
# rclpy relay; canvas pack = the robot's semantic-map RAG (load-once v0,
# /nina/instance_events increments later).
nina:
    enabled: false            # true on the robot / under SIL
    transport: ros            # ros (rclgo NATIVE — the engine IS the nina_speak
                              #   node; build with ROS=1 ./build.sh on a sourced
                              #   Humble host) | jsonl (SIL pipe, no ROS needed)
    arm_motion: false         # SAFETY: default false → sport/cmd_vel/nav_goal
                              #   are LOGGED, not published. The robot never
                              #   moves during bring-up or testing. Set true
                              #   only for real operation (operator decision).
    canvas_pack: ""           # canvas_query_pack.npz (dgx featloc / palace bundles)
    phrase_cache: ""          # phrase_cache.npz until the SigLIP text tower lands

prompt:  grammar/dog-prompt.txt
grammar: grammar/dog.gbnf
barge_in: "off"           # off (half-duplex) | vad (needs clean AEC) |
                          # confirm (soft-duck: transcript + owner voice must
                          # confirm before narration is cut — the robot setup)
