# The ReSpeaker 4 Mic Array (XVF-3000, 6-channel firmware): channel 0 is the processed
# speech (beamformed, noise-suppressed, echo-cancelled against what plays through the
# array's own jack); the others are raw mics. PipeWire opens it as 2.1, whose front-left
# is channel 0. This mono source is that channel alone, and the default source.
pulse.cmd = [
    { cmd = "load-module" args = "module-remap-source source_name=respeaker_asr master=alsa_input.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00.analog-surround-21 channels=1 master_channel_map=front-left channel_map=mono source_properties=device.description=ReSpeaker-ASR" flags = [ "nofail" ] }
    { cmd = "set-default-source" args = "respeaker_asr" flags = [ "nofail" ] }
]
