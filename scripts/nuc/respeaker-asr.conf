# Copy to ~/.config/pipewire/pipewire.conf.d/ (a PipeWire module, not a pipewire-pulse one); then
# pactl set-card-profile alsa_card.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00 pro-audio && pactl set-default-source respeaker_asr
# The ReSpeaker 4 Mic Array (XVF-3000, 6-channel firmware, 16 kHz only) in the card's pro-audio profile:
# aux0 is the processed speech (beamformed, noise-suppressed, echo-cancelled against its own jack),
# aux1..aux4 the raw mics, aux5 the playback reference. This loopback makes aux0 alone a 16 kHz mono
# source, respeaker_asr: no remix, no resampling. (pulse's module-remap-source on top of the 16 kHz
# device ran at 48 kHz float and gave Whisper noise; the direct ALSA ch0 was clean.)
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "ReSpeaker ASR (ch0)"
      capture.props = {
        node.name = "capture.respeaker_asr"
        audio.position = [ AUX0 ]
        audio.rate = 16000
        stream.dont-remix = true
        target.object = "alsa_input.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00.pro-input-0"
        node.passive = true
      }
      playback.props = {
        node.name = "respeaker_asr"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
        audio.rate = 16000
      }
    }
  }
]
