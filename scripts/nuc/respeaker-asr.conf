# The ReSpeaker 4 Mic Array (XVF-3000, 6-channel firmware) in the card's pro-audio profile: all six
# channels as aux0..aux5. aux0 is the processed speech (beamformed, noise-suppressed, echo-cancelled
# against what plays through the array's own jack). This mono source is aux0 alone, the default source.
# (The 2.1 profile PipeWire picks by default maps the six channels through ALSA's surround21 plug:
# not a reliable way to get channel 0.)
pulse.cmd = [
    { cmd = "load-module" args = "module-remap-source source_name=respeaker_asr master=alsa_input.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00.pro-input-0 channels=1 master_channel_map=aux0 channel_map=mono source_properties=device.description=ReSpeaker-ASR" flags = [ "nofail" ] }
    { cmd = "set-default-source" args = "respeaker_asr" flags = [ "nofail" ] }
]
