# The ReSpeaker 4 Mic Array (USB full speed, 6 x 16 kHz): PipeWire's default capture (mmap, 128-frame
# periods, 384-frame buffer) garbled ch0 and zeroed the raw mics, while arecord on the same device was
# clean. Plain read/write with larger periods, as arecord does.
monitor.alsa.rules = [
  { matches = [ { node.name = "~alsa_.*SEEED_ReSpeaker.*" } ]
    actions = { update-props = {
      api.alsa.disable-mmap = true
      api.alsa.period-size = 1024
      api.alsa.period-num = 4
      api.alsa.headroom = 1024
      session.suspend-timeout-seconds = 0
    } } }
]
