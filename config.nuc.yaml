# The NUC (i3-10110U, no GPU): the voice is local (ReSpeaker 4 Mic Array, Whisper on the CPU,
# Piper), the LLM is Gemini over its OpenAI-compatible API (fsttm.cloud). Measured here on
# 2026-11-21: Piper 3.8 s of speech in 0.26 s; Whisper base.en 2.2 s / tiny.en 1.0 s for that
# 3.8 s; Gemini 3.1 Flash-Lite ~1.7 s a short reply with thinking off.
#   fsttm --config config.nuc.yaml [--tui]
system:
    name: "Nina"
    intent_mode: false          # free conversation
    domain: null
    attention: true             # wait for the wake word ("hey Nina" and how Whisper spells it), then awake

    sleep_intent: false
    awake_s: 30                 # asleep again after 30 s with nothing said or replied
    wake_words: ["hey nina", "hi nina", "ok nina", "nina", "hey neena", "hey nena", "hey nino",
                 "hey nine", "a nina", "hey, nina"]
domains: {}
aec:
    enabled: false              # the ReSpeaker's XVF-3000 cancels echo itself, against what
                                # plays through its own jack (tts.sink below)
    rnnoise: false
server:
  http:
    host: "127.0.0.1"
    port: 8080
    request_max_size: 1048576
log:
  level:
    - logger: fsttm
      level: INFO
vad:
    vad_aggressiveness: 2         # 3 missed quiet far-field speech from the array
    device: null
    device_name: "pulse"        # the default source: respeaker_asr, the array's processed channel
                                # (~/.config/pipewire/pipewire-pulse.conf.d/respeaker-asr.conf)
    rate: 16000
    padding_ms: 600
    soft_duck: true
stt:
    model: "models/ggml-base.en-q5_1.bin"     # tiny: models/ggml-tiny.en-q5_1.bin (faster, less sure)
    language: "en"
    parasites: ["thank you", "thanks", "thanks for watching", "you"]
tts:
    backend: "piper"
    piper:
        model: "models/en_US-lessac-medium.onnx"
        sample_rate: 22050
        cuda: false
    device: "pulse"
    sink: "ReSpeaker"           # out through the array's jack: its echo canceller hears it
gpt:
    backend: openai
    model: gemini-3.1-flash-lite
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_file: ~/.config/fsttm/gemini.key
    temp: 0.7
    max_tokens: 200
    trim_on_barge_in: false
    request_extra: {reasoning_effort: none}
    n_threads: 4
    tools_port: 8768            # the home's tools: the Metis sidecar (fsttm-metis)
streams:
    port: 8766              # env + reasoning in (fsttm.streams): the HA bridge and the Metis sidecar write here
hass:                           # fsttm-hass: Home Assistant → the env stream (its own process)
    url: ws://127.0.0.1:8123/api/websocket
    token_file: ~/.config/fsttm/hass.token
metis:                          # fsttm-metis: the home's rule engine (metis-worlds home) beside the conversation
    python: ~/metis/metis-agent/py/.venv/bin/python
    cwd: ~/metis/metis-agent/py
    catalog: ~/metis/metis-worlds/home
    domains: [lights, air, media, scenes, comfort]
    env: {METISC: ~/metis/metis-lang/src/metisc, METIS_HOME_HA: "http://127.0.0.1:8123"}
    tool_port: 8768
    beat_s: 1.0
    call_timeout_s: 6
