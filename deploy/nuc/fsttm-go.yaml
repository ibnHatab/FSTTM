# The Go engine on the NUC (go/bin/fsttm-go, built by deploy/nuc/build.sh): the voice local (the ReSpeaker
# straight from ALSA, Whisper on the CPU, Piper), the LLM Gemini over its OpenAI-compatible API, the home's
# state and the rule engine's conclusions beside the conversation, the panel on :8767. Paths are relative to
# ~/repo/FSTTM (the unit's WorkingDirectory).

cloud:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model: gemini-3.1-flash-lite
    api_key_file: ~/.config/fsttm/gemini.key
    persona: "You are Nina, the voice of a flat's smart home. Users may address you as Nina."
    temperature: 0.7
    max_tokens: 200
    timeout_s: 30
    request_extra: {reasoning_effort: none}     # gemini-3.1-flash-lite thinks by default: 1.7 s vs ~3 s a reply

streams:
    addr: "127.0.0.1:8766"      # ENVIRONMENT (fsttm-hass) and REASONING (fsttm-metis) come in here
tools:
    addr: "127.0.0.1:8768"      # the home's tools: the rule engine (fsttm-metis)
panel:
    addr: "0.0.0.0:8767"        # the page: the dialog, the environment, the reasoning (LAN and tailnet)

audio:
    device: "ReSpeaker"         # straight from ALSA (hw:1,0): PipeWire's capture of this array is broken
    alsa: true                  # (deploy/nuc/audio/README.md); its PipeWire profile is output only
    channels: 6                 # the firmware's six: ch0 processed speech, ch1-4 raw mics, ch5 playback
    channel: 0
# The array's XVF-3000, set at start (go/pkg/respeaker; RAM only: a replug resets it). Measured with the
# array on Pascal, 2026-11-22: the firmware's AGC target 0.005 left its speech channel at about -49 dBFS;
# with these the room's floor fell ~9 dB and the same phrase came ~20 dB louder, transcribed the same,
# also over fan noise. HPF 125 Hz against the ventilation's rumble; stronger stationary suppression on
# the ASR channel. `respeaker` (go/cmd/respeaker) reads them all.
respeaker:
    AGCDESIREDLEVEL: 0.02
    HPFONOFF: 2
    GAMMA_NS_SR: 1.8
    MIN_NS_SR: 0.1

vad:
    aggressiveness: 2           # 3 missed quiet far-field speech from the array
    padding_ms: 600
barge_in: "off"                 # half-duplex until the speakers and the array's echo canceller are checked

stt:
    model: "models/ggml-base.en-q5_1.bin"
    language: "en"
    audio_ctx: 768              # whisper-cli on the NUC, the user's voice, -nf: 2.5 s clip 2.34 s -> 1.21 s,
                                # 10 s clip 2.89 s -> 1.51 s, the same words (no punctuation); 512 was SLOWER
                                # (2.48 s), which is why an earlier try at 512 found no gain; 768 = ~15 s of audio
    threads: 4
    no_fallback: true           # no re-decoding hotter: bounds a short utterance's time
    parasites: ["thank you", "thanks", "thanks for watching", "you"]

tts:
    engine: piper               # FSTTM_TTS_ENGINE in fsttm-go.service overrides it: paradee there (install.sh swap-go)
    voice: af_heart             # paradee: af_heart (the narration script's), bf_isabella, am_puck, bm_fable
    paradee:                    # in-process: misaki's G2P in Go + onnxruntime, 24 kHz, played with paplay
        dir: models/paradee     # paradee_int8.onnx, config.json, us_gold.json, us_silver.json (install.sh models)
        speed: 1.0              # the narration script reads at 1.3
        threads: 2              # ~20x real time on one thread already
    piper: "http://127.0.0.1:5150"   # engine piper: the Piper HTTP server (piper-tts.service, legacy)
    sink: ""                    # the default sink: the ReSpeaker's jack (its echo canceller hears it)

hass:                           # fsttm-hass (Go): Home Assistant → the env stream at streams.addr
    url: ws://127.0.0.1:8123/api/websocket
    token_file: ~/.config/fsttm/hass.token
    dump: false                 # metis-home's semantic world serves ENVIRONMENT (beliefs with confidence and age);
                                # true: fsttm-hass's raw entity dump again (the fallback; restart fsttm-hass)

attention:
    enabled: true
    awake_s: 30                 # asleep again after 30 s with nothing said or replied
    wake_words: ["hey nina", "hi nina", "ok nina", "nina", "hey neena", "hey nena", "hey nino",
                 "hey nine", "a nina", "hey, nina"]
